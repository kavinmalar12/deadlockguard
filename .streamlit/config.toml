[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 15
showEmailPrompt = false

[theme]
base = "dark"
primaryColor = "#00E5FF"
backgroundColor = "#0E131F"
secondaryBackgroundColor = "#182032"
textColor = "#F0F4F8"
font = "sans serif"

[browser]
gatherUsageStats = false
